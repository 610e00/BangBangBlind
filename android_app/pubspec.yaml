publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # YOLO 模型推論
  ultralytics_yolo: 0.6.15

  # 雙聲道骨傳導耳機提示音（新增）
  audioplayers: 6.4.0

  # 原有套件，暫時保留
  flutter_tts: ^4.2.5
  vibration: ^3.2.1
  uvc_android_flutter: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/best.tflite
